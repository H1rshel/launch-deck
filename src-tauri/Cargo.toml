[package]
name = "launch-deck"
version = "0.1.75"
description = "A premium futuristic game launcher"
authors = ["Launch Deck"]
edition = "2021"

[lib]
# Tauri mobile loads the app as a shared library from the Android/iOS
# activity; desktop keeps using the thin main.rs binary.
name = "launch_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
# rustls instead of the platform TLS stack: Android has no system OpenSSL,
# and rustls works identically on Windows. (zstd dropped: its C build
# complicates NDK cross-compilation and servers fall back to gzip/brotli.)
reqwest = { version = "0.13.2", default-features = false, features = ["json", "gzip", "brotli", "deflate", "rustls", "http2", "charset", "system-proxy"] }
sha2 = "0.10"
dotenv = "0.15.0"
tokio = { version = "1", features = ["net", "time", "io-util", "sync"] }
urlencoding = "2"
pelite = "0.10.0"
base64 = "0.22"

# Desktop-only plugins (no mobile support)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
